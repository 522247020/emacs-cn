name: build

# Gitea Actions 工作流：不依赖任何外部 action（github.com 被墙/离线也能跑）。
#
# 前置：
#   * 已注册 act_runner，标签为 ubuntu-latest（不是的话改下面的 runs-on）
#   * runner 容器能访问你的 Gitea 服务器（用其 IP/域名）
#   * 能访问 apt 源（国内可给容器配镜像源）
#
# 说明：本工作流用 `git clone` + `curl` 调 Gitea API 代替
# actions/checkout 与 actions/upload-artifact，避免从 github.com 拉取 action。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout（git clone，不走外部 action）
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          echo "server=$GITHUB_SERVER_URL repo=$GITHUB_REPOSITORY ref=$GITHUB_REF"
          SCHEME=$(printf '%s' "$GITHUB_SERVER_URL" | sed -E 's#^(https?)://.*#\1#')
          HOST=${GITHUB_SERVER_URL#*://}
          git config --global --add safe.directory '*'
          rm -rf repo
          git clone --depth 1 \
            "${SCHEME}://oauth2:${TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git" repo
          cd repo
          # 打 tag 时检出该 tag 的提交
          if [ -n "${GITHUB_REF_NAME:-}" ] \
             && git ls-remote --tags origin "refs/tags/${GITHUB_REF_NAME}" | grep -q .; then
            git fetch --depth 1 origin "refs/tags/${GITHUB_REF_NAME}"
            git checkout -q FETCH_HEAD
          fi
          git log --oneline -1

      - name: 安装构建依赖
        working-directory: repo
        run: sh ci/install-deps.sh

      - name: 构建并打包
        working-directory: repo
        env:
          PREFIX: /opt/emacs-cn
          NATIVE: yes
        run: |
          set -eu
          sh ci/build-emacs.sh

      - name: 发布（main 自动打 tag / tag 推送）
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        working-directory: repo
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh ci/gitea-release.sh emacs-cn*.tar.zst emacs-cn*.deb emacs-cn*.pkg.tar.zst

  # Arch 版本：在 archlinux 容器里构建，产出的二进制用 Arch 的
  # libxml2.so.16 等 soname，可直接在 Arch/Manjaro/Omarchy 上运行。
  build-arch:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 240
    container:
      image: archlinux:latest
    steps:
      - name: 准备 git
        run: pacman -Sy --noconfirm git

      - name: Checkout（git clone）
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          SCHEME=$(printf '%s' "$GITHUB_SERVER_URL" | sed -E 's#^(https?)://.*#\1#')
          HOST=${GITHUB_SERVER_URL#*://}
          git config --global --add safe.directory '*'
          rm -rf repo
          git clone --depth 1 \
            "${SCHEME}://oauth2:${TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git" repo
          cd repo
          if [ -n "${GITHUB_REF_NAME:-}" ] \
             && git ls-remote --tags origin "refs/tags/${GITHUB_REF_NAME}" | grep -q .; then
            git fetch --depth 1 origin "refs/tags/${GITHUB_REF_NAME}"
            git checkout -q FETCH_HEAD
          fi
          git log --oneline -1

      - name: 安装依赖（Arch）
        working-directory: repo
        run: sh ci/install-deps.sh

      - name: 构建并打包（Arch）
        working-directory: repo
        env:
          PREFIX: /opt/emacs-cn
          NATIVE: yes
        run: sh ci/build-emacs.sh

      - name: 上传产物到 Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        working-directory: repo
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh ci/gitea-upload.sh emacs-cn-arch-*.tar.zst emacs-cn*.pkg.tar.zst

  # Wayland 版：Debian/Ubuntu，pure-GTK(PGTK) 后端，原生支持 Wayland。
  build-wayland:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 240
    steps:
      - name: Checkout（git clone，不走外部 action）
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          SCHEME=$(printf '%s' "$GITHUB_SERVER_URL" | sed -E 's#^(https?)://.*#\1#')
          HOST=${GITHUB_SERVER_URL#*://}
          git config --global --add safe.directory '*'
          rm -rf repo
          git clone --depth 1 \
            "${SCHEME}://oauth2:${TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git" repo
          cd repo
          if [ -n "${GITHUB_REF_NAME:-}" ] \
             && git ls-remote --tags origin "refs/tags/${GITHUB_REF_NAME}" | grep -q .; then
            git fetch --depth 1 origin "refs/tags/${GITHUB_REF_NAME}"
            git checkout -q FETCH_HEAD
          fi
          git log --oneline -1

      - name: 安装构建依赖
        working-directory: repo
        run: sh ci/install-deps.sh

      - name: 构建并打包（Wayland/PGTK）
        working-directory: repo
        env:
          PREFIX: /opt/emacs-cn
          NATIVE: yes
          TOOLKIT: pgtk
        run: sh ci/build-emacs.sh

      - name: 上传产物到 Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        working-directory: repo
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh ci/gitea-upload.sh emacs-cn*.tar.zst emacs-cn*.deb emacs-cn*.pkg.tar.zst

  # Arch + Wayland：在 archlinux 容器里构建 pure-GTK(PGTK) 版本。
  build-arch-wayland:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 240
    container:
      image: archlinux:latest
    steps:
      - name: 准备 git
        run: pacman -Sy --noconfirm git

      - name: Checkout（git clone）
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          SCHEME=$(printf '%s' "$GITHUB_SERVER_URL" | sed -E 's#^(https?)://.*#\1#')
          HOST=${GITHUB_SERVER_URL#*://}
          git config --global --add safe.directory '*'
          rm -rf repo
          git clone --depth 1 \
            "${SCHEME}://oauth2:${TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git" repo
          cd repo
          if [ -n "${GITHUB_REF_NAME:-}" ] \
             && git ls-remote --tags origin "refs/tags/${GITHUB_REF_NAME}" | grep -q .; then
            git fetch --depth 1 origin "refs/tags/${GITHUB_REF_NAME}"
            git checkout -q FETCH_HEAD
          fi
          git log --oneline -1

      - name: 安装依赖（Arch）
        working-directory: repo
        run: sh ci/install-deps.sh

      - name: 构建并打包（Arch + Wayland/PGTK）
        working-directory: repo
        env:
          PREFIX: /opt/emacs-cn
          NATIVE: yes
          TOOLKIT: pgtk
        run: sh ci/build-emacs.sh

      - name: 上传产物到 Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        working-directory: repo
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh ci/gitea-upload.sh emacs-cn-arch-*.tar.zst emacs-cn*.pkg.tar.zst
