name: build

# Gitea Actions 工作流：不依赖任何外部 action（github.com 被墙/离线也能跑）。
#
# 前置：
#   * 已注册 act_runner，标签为 ubuntu-latest（不是的话改下面的 runs-on）
#   * runner 容器能访问你的 Gitea 服务器（用其 IP/域名）
#   * 能访问 apt 源（国内可给容器配镜像源）
#
# 说明：本工作流用 `git clone` + `curl` 调 Gitea API 代替
# actions/checkout 与 actions/upload-artifact，避免从 github.com 拉取 action。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout（git clone，不走外部 action）
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          echo "server=$GITHUB_SERVER_URL repo=$GITHUB_REPOSITORY ref=$GITHUB_REF"
          SCHEME=$(printf '%s' "$GITHUB_SERVER_URL" | sed -E 's#^(https?)://.*#\1#')
          HOST=${GITHUB_SERVER_URL#*://}
          git config --global --add safe.directory '*'
          rm -rf repo
          git clone --depth 1 \
            "${SCHEME}://oauth2:${TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git" repo
          cd repo
          # 打 tag 时检出该 tag 的提交
          if [ -n "${GITHUB_REF_NAME:-}" ] \
             && git ls-remote --tags origin "refs/tags/${GITHUB_REF_NAME}" | grep -q .; then
            git fetch --depth 1 origin "refs/tags/${GITHUB_REF_NAME}"
            git checkout -q FETCH_HEAD
          fi
          git log --oneline -1

      - name: 安装构建依赖
        working-directory: repo
        run: sh ci/install-deps.sh

      - name: 构建并打包
        working-directory: repo
        env:
          PREFIX: /opt/emacs-cn
          NATIVE: yes
        run: |
          set -eu
          sh ci/build-emacs.sh

      - name: 发布（main 自动打 tag / tag 推送）
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        working-directory: repo
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: token ${TOKEN}"
          ASSET=$(ls emacs-cn-*.tar.zst 2>/dev/null | head -1)
          [ -n "$ASSET" ] || { echo "找不到构建产物 emacs-cn-*.tar.zst"; ls -la; exit 1; }
          echo "产物: $ASSET"

          case "${GITHUB_REF:-}" in
            refs/tags/*) TAG="${GITHUB_REF_NAME}" ;;
            refs/heads/main)
              [ -f VERSION ] || { echo "缺少 VERSION 文件"; exit 1; }
              TAG="v$(cat VERSION)" ;;
            *) echo "非 main/tag，跳过发布"; exit 0 ;;
          esac
          echo "== TAG=$TAG =="

          # 1) 创建 tag（已存在也继续）
          printf '{"tag_name":"%s","target":"%s"}' "$TAG" "${GITHUB_SHA}" > /tmp/tag.json
          code=$(curl -s -o /tmp/tag.out -w '%{http_code}' -X POST "$API/tags" \
            -H "$AUTH" -H 'Content-Type: application/json' --data @/tmp/tag.json)
          echo "tag HTTP $code"; cat /tmp/tag.out; echo

          # 2) 创建 Release（已存在也继续）
          printf '{"tag_name":"%s","name":"%s","target_commitish":"%s"}' \
            "$TAG" "$TAG" "${GITHUB_SHA}" > /tmp/rel.json
          code=$(curl -s -o /tmp/rel.out -w '%{http_code}' -X POST "$API/releases" \
            -H "$AUTH" -H 'Content-Type: application/json' --data @/tmp/rel.json)
          echo "release HTTP $code"; cat /tmp/rel.out; echo

          # 3) 取 Release id
          REL=$(curl -s -H "$AUTH" "$API/releases/tags/$TAG")
          RID=$(printf '%s' "$REL" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2 || true)
          [ -n "${RID:-}" ] || { echo "无法获取 Release id：$REL"; exit 1; }
          echo "Release id=$RID"

          # 4) 删除同名旧附件（幂等）
          for aid in $(curl -s -H "$AUTH" "$API/releases/$RID/assets" \
                       | grep -o '"id":[0-9]*' | cut -d: -f2); do
            curl -s -X DELETE -H "$AUTH" "$API/releases/$RID/assets/$aid" >/dev/null || true
          done

          # 5) 上传附件（tar.zst + 原生包）
          for f in emacs-cn-*.tar.zst emacs-cn_*.deb emacs-cn-*.pkg.tar.zst; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            code=$(curl -s -o /tmp/asset.out -w '%{http_code}' -X POST \
              "$API/releases/$RID/assets?name=$name" \
              -H "$AUTH" -F "attachment=@$f")
            echo "$name HTTP $code"
            [ "$code" = 201 ] || { echo "附件上传失败: $name"; cat /tmp/asset.out; exit 1; }
          done
          echo "已发布 $TAG"

  # Arch 版本：在 archlinux 容器里构建，产出的二进制用 Arch 的
  # libxml2.so.16 等 soname，可直接在 Arch/Manjaro/Omarchy 上运行。
  build-arch:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 240
    container:
      image: archlinux:latest
    steps:
      - name: 准备 git
        run: pacman -Sy --noconfirm git

      - name: Checkout（git clone）
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          SCHEME=$(printf '%s' "$GITHUB_SERVER_URL" | sed -E 's#^(https?)://.*#\1#')
          HOST=${GITHUB_SERVER_URL#*://}
          git config --global --add safe.directory '*'
          rm -rf repo
          git clone --depth 1 \
            "${SCHEME}://oauth2:${TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git" repo
          cd repo
          if [ -n "${GITHUB_REF_NAME:-}" ] \
             && git ls-remote --tags origin "refs/tags/${GITHUB_REF_NAME}" | grep -q .; then
            git fetch --depth 1 origin "refs/tags/${GITHUB_REF_NAME}"
            git checkout -q FETCH_HEAD
          fi
          git log --oneline -1

      - name: 安装依赖（Arch）
        working-directory: repo
        run: sh ci/install-deps.sh

      - name: 构建并打包（Arch）
        working-directory: repo
        env:
          PREFIX: /opt/emacs-cn
          NATIVE: yes
          OUT: emacs-cn-arch-x86_64.tar.zst
        run: sh ci/build-emacs.sh

      - name: 上传 Arch 产物到 Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        working-directory: repo
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: token ${TOKEN}"
          ASSET="emacs-cn-arch-x86_64.tar.zst"
          case "${GITHUB_REF:-}" in
            refs/tags/*) TAG="${GITHUB_REF_NAME}" ;;
            *)           TAG="v$(cat VERSION)" ;;
          esac
          REL=$(curl -s -H "$AUTH" "$API/releases/tags/$TAG")
          RID=$(printf '%s' "$REL" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2 || true)
          if [ -z "${RID:-}" ]; then
            echo "未找到 Release $TAG（可能 Debian 构建尚未发布），跳过"
            exit 0
          fi
          # 删除同名旧附件（幂等）
          for aid in $(curl -s -H "$AUTH" "$API/releases/$RID/assets" \
                       | grep -o '"id":[0-9]*' | cut -d: -f2); do
            curl -s -X DELETE -H "$AUTH" "$API/releases/$RID/assets/$aid" >/dev/null || true
          done
          # 上传 tar.zst + pacman 包
          for f in emacs-cn-arch-x86_64.tar.zst emacs-cn-*.pkg.tar.zst; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            code=$(curl -s -o /tmp/asset2.out -w '%{http_code}' -X POST \
              "$API/releases/$RID/assets?name=$name" \
              -H "$AUTH" -F "attachment=@$f")
            echo "$name HTTP $code"
            [ "$code" = 201 ] || { echo "附件上传失败: $name"; cat /tmp/asset2.out; exit 1; }
          done
          echo "已上传 Arch 产物到 Release $TAG"
