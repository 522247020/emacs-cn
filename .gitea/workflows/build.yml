name: build

# Gitea Actions 工作流：不依赖任何外部 action（github.com 被墙/离线也能跑）。
#
# 前置：
#   * 已注册 act_runner，标签为 ubuntu-latest（不是的话改下面的 runs-on）
#   * runner 容器能访问你的 Gitea 服务器（用其 IP/域名）
#   * 能访问 apt 源（国内可给容器配镜像源）
#
# 说明：本工作流用 `git clone` + `curl` 调 Gitea API 代替
# actions/checkout 与 actions/upload-artifact，避免从 github.com 拉取 action。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout（git clone，不走外部 action）
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          echo "server=$GITHUB_SERVER_URL repo=$GITHUB_REPOSITORY ref=$GITHUB_REF"
          SCHEME=$(printf '%s' "$GITHUB_SERVER_URL" | sed -E 's#^(https?)://.*#\1#')
          HOST=${GITHUB_SERVER_URL#*://}
          git config --global --add safe.directory '*'
          rm -rf repo
          git clone --depth 1 \
            "${SCHEME}://oauth2:${TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git" repo
          cd repo
          # 打 tag 时检出该 tag 的提交
          if [ -n "${GITHUB_REF_NAME:-}" ] \
             && git ls-remote --tags origin "refs/tags/${GITHUB_REF_NAME}" | grep -q .; then
            git fetch --depth 1 origin "refs/tags/${GITHUB_REF_NAME}"
            git checkout -q FETCH_HEAD
          fi
          git log --oneline -1

      - name: 安装构建依赖
        working-directory: repo
        run: |
          set -eu
          SUDO=""
          [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          # 默认 apt 源不可用时，尝试切换为清华镜像
          if ! $SUDO apt-get update -qq; then
            echo "==> 默认 apt 源不可用，切换到清华镜像"
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              [ -f "$f" ] || continue
              $SUDO sed -i \
                -e 's|https\?://archive.ubuntu.com/ubuntu|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' \
                -e 's|https\?://security.ubuntu.com/ubuntu|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' \
                -e 's|https\?://ports.ubuntu.com/ubuntu-ports|https://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports|g' \
                "$f" 2>/dev/null || true
            done
            $SUDO apt-get update -qq
          fi
          $SUDO apt-get install -y --no-install-recommends \
            build-essential autoconf automake texinfo pkg-config zstd curl ca-certificates \
            libgnutls28-dev libxml2-dev libjansson-dev libgmp-dev \
            libgtk-3-dev libharfbuzz-dev libncurses-dev zlib1g-dev \
            libjpeg-dev libpng-dev libgif-dev libtiff-dev librsvg2-dev libxpm-dev
          # libgccjit 的 dev 包在 universe 里，先确保启用
          $SUDO apt-get install -y software-properties-common >/dev/null 2>&1 || true
          $SUDO add-apt-repository -y universe >/dev/null 2>&1 || true
          $SUDO apt-get update -qq || true
          # 依次尝试常见版本（仅 -dev 包才有 -lgccjit）
          for v in 15 14 13 12 11 10; do
            if $SUDO apt-get install -y "libgccjit-${v}-dev"; then
              echo "已安装 libgccjit-${v}-dev"
              break
            fi
          done
          # 安装成功与否都不致命：构建脚本会自动回退到无原生编译

      - name: 构建并打包
        working-directory: repo
        env:
          PREFIX: /opt/emacs-cn
          NATIVE: yes
        run: |
          set -eu
          sh ci/build-emacs.sh

      - name: 发布（main 自动打 tag / tag 推送）
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        working-directory: repo
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: token ${TOKEN}"

          case "${GITHUB_REF:-}" in
            refs/tags/*)
              TAG="${GITHUB_REF_NAME}"
              ;;
            refs/heads/main)
              if [ ! -f VERSION ]; then echo "缺少 VERSION 文件"; exit 1; fi
              TAG="v$(cat VERSION)"
              if curl -sf -H "$AUTH" "$API/tags/$TAG" >/dev/null 2>&1; then
                echo "tag $TAG 已存在（如需发新版本，请修改 VERSION 后重推）"
                exit 0
              fi
              echo "创建 tag: $TAG -> ${GITHUB_SHA}"
              curl -sf -X POST "$API/tags" -H "$AUTH" -H "Content-Type: application/json" \
                -d "{\"tag_name\":\"$TAG\",\"target\":\"${GITHUB_SHA}\"}"
              ;;
            *)
              echo "非 main/tag，跳过发布"
              exit 0
              ;;
          esac

          echo "创建 Release: $TAG"
          curl -sf -X POST "$API/releases" -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}" > release.json || true
          cat release.json || true
          RID=$(curl -sf -H "$AUTH" "$API/releases/tags/$TAG" \
                | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2 || true)
          if [ -n "${RID:-}" ]; then
            curl -sf -X POST "$API/releases/$RID/assets?name=emacs-cn-linux-x86_64.tar.zst" \
              -H "$AUTH" -F "attachment=@emacs-cn-linux-x86_64.tar.zst"
            echo "已上传附件到 Release $TAG"
          else
            echo "未能获取 Release id（可能权限不足）"
            exit 1
          fi
