name: build

# 触发：推送到 main、打 tag、PR、手动
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 打 tag 时创建 Release 需要写权限
permissions:
  contents: write

# 三种体系各自构建（.deb 的依赖与 SONAME 必须匹配目标发行版）：
#   build        —— Ubuntu 原生 runner，产出 emacs-cn-ubuntu_*_*.deb
#   build-debian —— Debian 容器，产出 emacs-cn-debian_*_*.deb（适配 Raspberry Pi OS）
#   build-arch   —— Arch 容器，产出 .pkg.tar.zst
# 每种又分 X11（默认）与 Wayland（--with-pgtk，包名 emacs-cn-wayland）。

jobs:
  # ---- Ubuntu（amd64 + arm64）----
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    toolkit: x11,  suffix: ubuntu-amd64 }
          - { runner: ubuntu-latest,    toolkit: pgtk, suffix: ubuntu-amd64-wayland }
          - { runner: ubuntu-24.04-arm, toolkit: x11,  suffix: ubuntu-arm64 }
          - { runner: ubuntu-24.04-arm, toolkit: pgtk, suffix: ubuntu-arm64-wayland }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: sh ci/install-deps.sh

      - name: Build and package
        env:
          PREFIX: /opt/emacs-cn
          NATIVE: yes
          TOOLKIT: ${{ matrix.toolkit }}
        run: sh ci/build-emacs.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emacs-cn-${{ matrix.suffix }}
          path: |
            emacs-cn-ubuntu-*.tar.zst
            emacs-cn*-ubuntu_*.deb
          compression-level: 0
          if-no-files-found: error

  # ---- Debian（amd64 + arm64）：供 Debian / Raspberry Pi OS 使用 ----
  build-debian:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    toolkit: x11,  suffix: debian-amd64 }
          - { runner: ubuntu-latest,    toolkit: pgtk, suffix: debian-amd64-wayland }
          - { runner: ubuntu-24.04-arm, toolkit: x11,  suffix: debian-arm64 }
          - { runner: ubuntu-24.04-arm, toolkit: pgtk, suffix: debian-arm64-wayland }
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 240
    steps:
      # 容器里先装 git / node（actions/checkout、upload-artifact 需要）
      - name: Install git and node
        run: |
          apt-get update
          apt-get install -y git nodejs ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: sh ci/install-deps.sh

      - name: Build and package
        env:
          PREFIX: /opt/emacs-cn
          NATIVE: yes
          TOOLKIT: ${{ matrix.toolkit }}
        run: sh ci/build-emacs.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emacs-cn-${{ matrix.suffix }}
          path: |
            emacs-cn-debian-*.tar.zst
            emacs-cn*-debian_*.deb
          compression-level: 0
          if-no-files-found: error

  # ---- Arch Linux（pacman 包，x86_64）----
  build-arch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toolkit: x11,  suffix: arch-x86_64 }
          - { toolkit: pgtk, suffix: arch-x86_64-wayland }
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 240
    steps:
      - name: Install git and node
        run: pacman -Sy --noconfirm git nodejs

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: sh ci/install-deps.sh

      - name: Build and package
        env:
          PREFIX: /opt/emacs-cn
          NATIVE: yes
          TOOLKIT: ${{ matrix.toolkit }}
        run: sh ci/build-emacs.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emacs-cn-${{ matrix.suffix }}
          path: |
            emacs-cn-arch-*.tar.zst
            emacs-cn*.pkg.tar.zst
          compression-level: 0
          if-no-files-found: error

  # ---- 所有构建完成后，统一创建 Release 并附上全部产物 ----
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-debian, build-arch]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
