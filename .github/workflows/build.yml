name: build

# 触发：推送到 main、打 tag、PR、手动
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 打 tag 时创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: sh ci/install-deps.sh

      - name: Build and package
        env:
          PREFIX: /opt/emacs-cn
          NATIVE: yes
        run: sh ci/build-emacs.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emacs-cn-linux-x86_64
          path: |
            emacs-cn-*.tar.zst
            emacs-cn_*.deb
            emacs-cn-*.pkg.tar.zst
          compression-level: 0
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            emacs-cn-*.tar.zst
            emacs-cn_*.deb
            emacs-cn-*.pkg.tar.zst
          generate_release_notes: true
