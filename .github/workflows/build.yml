name: build

# 触发：推送到 main、打 tag、PR、手动
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 打 tag 时创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake texinfo pkg-config zstd \
            libgnutls28-dev libxml2-dev libjansson-dev libgmp-dev \
            libgtk-3-dev libharfbuzz-dev libncurses-dev zlib1g-dev \
            libjpeg-dev libpng-dev libgif-dev libtiff-dev librsvg2-dev libxpm-dev
          # libgccjit 的 dev 包在 universe 里（仅 -dev 包才有 -lgccjit）
          sudo apt-get install -y software-properties-common >/dev/null 2>&1 || true
          sudo add-apt-repository -y universe >/dev/null 2>&1 || true
          sudo apt-get update -qq || true
          for v in 15 14 13 12 11 10; do
            if sudo apt-get install -y "libgccjit-${v}-dev"; then
              echo "已安装 libgccjit-${v}-dev"
              break
            fi
          done

      - name: Build and package
        env:
          PREFIX: /opt/emacs-cn
          NATIVE: yes
        run: sh ci/build-emacs.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emacs-cn-linux-x86_64
          path: emacs-cn-linux-x86_64.tar.zst
          compression-level: 0
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: emacs-cn-linux-x86_64.tar.zst
          generate_release_notes: true
