name: build

# 触发：推送到 main、打 tag、PR、手动
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 打 tag 时创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    # x86_64 与 arm64 各构建两种图形后端：
    #   x11  —— --with-x-toolkit=gtk3（默认）
    #   pgtk —— --with-pgtk（纯 GTK，原生 Wayland，即 emacs-wayland）
    # 说明：arm64 使用 GitHub 的 ARM 托管 runner（公开仓库可用）。
    # 若你的账户不支持，删掉下面两行 runner 为 ubuntu-24.04-arm 的条目即可。
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    toolkit: x11,  suffix: x86_64 }
          - { runner: ubuntu-latest,    toolkit: pgtk, suffix: x86_64-wayland }
          - { runner: ubuntu-24.04-arm, toolkit: x11,  suffix: arm64 }
          - { runner: ubuntu-24.04-arm, toolkit: pgtk, suffix: arm64-wayland }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: sh ci/install-deps.sh

      - name: Build and package
        env:
          PREFIX: /opt/emacs-cn
          NATIVE: yes
          TOOLKIT: ${{ matrix.toolkit }}
        run: sh ci/build-emacs.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emacs-cn-${{ matrix.suffix }}
          path: |
            emacs-cn-*.tar.zst
            emacs-cn*.deb
            emacs-cn*.pkg.tar.zst
          compression-level: 0
          if-no-files-found: error

  # 所有构建完成后，统一创建 Release 并附上全部产物。
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
